<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURORA STORE — BY LUCIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  /* ============================
     CSS VARIABLES & RESET
  ============================ */
  :root {
    --cyan: #00CFFF;
    --violet: #7B2FFF;
    --cyan-dim: rgba(0,207,255,0.15);
    --violet-dim: rgba(123,47,255,0.15);
    --cyan-glow: 0 0 20px rgba(0,207,255,0.6), 0 0 40px rgba(0,207,255,0.2);
    --violet-glow: 0 0 20px rgba(123,47,255,0.6), 0 0 40px rgba(123,47,255,0.2);
    --glass-bg: rgba(8,12,28,0.55);
    --glass-border: rgba(0,207,255,0.18);
    --bg-dark: #04060f;
    --text-primary: #e8f4ff;
    --text-muted: rgba(232,244,255,0.5);
    --font-hud: 'Orbitron', monospace;
    --font-mono: 'Share Tech Mono', monospace;
    --font-body: 'Rajdhani', sans-serif;
    --radius: 12px;
    --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-body);
    background: var(--bg-dark);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* ============================
     DYNAMIC BACKGROUND
  ============================ */
  .bg-aurora {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse 80% 60% at 20% 30%, rgba(123,47,255,0.18) 0%, transparent 70%),
                radial-gradient(ellipse 60% 50% at 80% 70%, rgba(0,207,255,0.15) 0%, transparent 65%),
                radial-gradient(ellipse 40% 40% at 50% 50%, rgba(0,20,50,0.8) 0%, var(--bg-dark) 100%);
    animation: auroraShift 18s ease-in-out infinite alternate;
  }
  .bg-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.04;
    background-image:
      linear-gradient(rgba(0,207,255,1) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,207,255,1) 1px, transparent 1px);
    background-size: 48px 48px;
    animation: gridScroll 30s linear infinite;
  }
  .bg-scanlines {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.03;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,207,255,0.5) 2px, rgba(0,207,255,0.5) 3px);
  }
  @keyframes auroraShift {
    0%   { background-position: 0% 50%, 100% 50%, center; filter: hue-rotate(0deg); }
    100% { background-position: 30% 70%, 70% 30%, center; filter: hue-rotate(25deg); }
  }
  @keyframes gridScroll {
    0%   { transform: translateY(0); }
    100% { transform: translateY(48px); }
  }

  /* ============================
     LAYOUT WRAPPER
  ============================ */
  .wrapper {
    position: relative; z-index: 1;
    max-width: 1440px; margin: 0 auto;
    padding: 0 20px 60px;
  }

  /* ============================
     HEADER
  ============================ */
  header {
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    background: rgba(4,6,15,0.85);
    border-bottom: 1px solid var(--glass-border);
    padding: 0 20px;
  }
  .header-inner {
    max-width: 1440px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    height: 70px; gap: 16px; flex-wrap: wrap;
  }
  .logo-wrap {
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  .logo-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--violet), var(--cyan));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-hud); font-weight: 900; font-size: 14px;
    box-shadow: var(--cyan-glow);
    animation: logoPulse 3s ease-in-out infinite;
  }
  @keyframes logoPulse {
    0%,100% { box-shadow: var(--cyan-glow); }
    50%      { box-shadow: var(--violet-glow); }
  }
  .logo-text { font-family: var(--font-hud); font-weight: 900; font-size: 18px; letter-spacing: 3px; }
  .logo-text span { color: var(--cyan); }
  .logo-sub { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); letter-spacing: 2px; margin-top: -2px; }

  /* HUD CLOCK + PING */
  .hud-panel {
    display: flex; align-items: center; gap: 20px; flex-shrink: 0;
  }
  .hud-clock {
    font-family: var(--font-mono); font-size: 22px; color: var(--cyan);
    text-shadow: var(--cyan-glow);
    letter-spacing: 2px; min-width: 90px;
  }
  .hud-ping {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-size: 11px; color: #00ff9d;
    background: rgba(0,255,157,0.07); border: 1px solid rgba(0,255,157,0.25);
    border-radius: 20px; padding: 5px 14px;
    white-space: nowrap;
  }
  .ping-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #00ff9d; box-shadow: 0 0 8px #00ff9d;
    animation: pingBlink 1.5s ease-in-out infinite;
  }
  @keyframes pingBlink { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }

  /* ============================
     SEARCH BAR
  ============================ */
  .search-wrap {
    flex: 1; max-width: 420px; min-width: 180px; position: relative;
  }
  .search-wrap svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; opacity: 0.5;
  }
  #searchInput {
    width: 100%; padding: 10px 14px 10px 40px;
    background: rgba(0,207,255,0.06); border: 1px solid rgba(0,207,255,0.25);
    border-radius: 30px; color: var(--text-primary);
    font-family: var(--font-mono); font-size: 13px; outline: none;
    transition: var(--transition);
  }
  #searchInput:focus {
    border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0,207,255,0.1), var(--cyan-glow);
    background: rgba(0,207,255,0.1);
  }
  #searchInput::placeholder { color: var(--text-muted); }

  /* ============================
     TABS / CATEGORY NAV
  ============================ */
  .nav-tabs {
    display: flex; gap: 6px; overflow-x: auto;
    padding: 20px 0 4px; scrollbar-width: none;
    animation: fadeUp 0.5s ease both;
  }
  .nav-tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    flex-shrink: 0; padding: 8px 22px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 30px; color: var(--text-muted);
    font-family: var(--font-hud); font-size: 11px; letter-spacing: 1.5px;
    cursor: pointer; transition: var(--transition); white-space: nowrap;
  }
  .tab-btn:hover { color: var(--cyan); border-color: rgba(0,207,255,0.4); }
  .tab-btn.active {
    background: linear-gradient(135deg, rgba(0,207,255,0.2), rgba(123,47,255,0.2));
    border-color: var(--cyan); color: var(--cyan);
    box-shadow: 0 0 16px rgba(0,207,255,0.2);
  }

  /* Stats bar */
  .stats-bar {
    display: flex; align-items: center; gap: 20px;
    padding: 10px 0 6px; flex-wrap: wrap;
    font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);
  }
  .stats-bar span { color: var(--cyan); font-weight: bold; }
  #resultCount { color: var(--cyan); }

  /* ============================
     GAME GRID
  ============================ */
  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px; padding: 16px 0 0;
  }

  /* ============================
     GAME CARD
  ============================ */
  .game-card {
    background: var(--glass-bg);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius); overflow: hidden;
    cursor: pointer; position: relative;
    transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    animation: cardFadeUp 0.5s ease both;
  }
  .game-card::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(0,207,255,0.07), rgba(123,47,255,0.07));
    opacity: 0; transition: opacity var(--transition); z-index: 0;
  }
  .game-card:hover { transform: translateY(-6px) scale(1.02); border-color: var(--cyan); box-shadow: var(--cyan-glow), 0 20px 40px rgba(0,0,0,0.6); }
  .game-card:hover::before { opacity: 1; }

  .card-cover {
    width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block;
    background: linear-gradient(135deg, var(--violet-dim), var(--cyan-dim));
    transition: filter var(--transition);
    position: relative; overflow: hidden;
  }
  .game-card:hover .card-cover { filter: brightness(1.15) saturate(1.3); }
  .card-cover-placeholder {
    width: 100%; aspect-ratio: 16/9;
    display: flex; align-items: center; justify-content: center;
    font-size: 42px;
    background: linear-gradient(135deg, rgba(123,47,255,0.3), rgba(0,207,255,0.15));
  }

  .card-badge {
    position: absolute; top: 10px; right: 10px; z-index: 2;
    padding: 3px 9px; border-radius: 4px;
    font-family: var(--font-hud); font-size: 9px; letter-spacing: 1px;
    font-weight: 700;
  }
  .badge-game   { background: rgba(0,207,255,0.85); color: #000; }
  .badge-app    { background: rgba(123,47,255,0.85); color: #fff; }
  .badge-emu    { background: rgba(255,100,0,0.85);  color: #fff; }
  .badge-plugin { background: rgba(0,200,100,0.85);  color: #000; }

  .card-body { padding: 14px; position: relative; z-index: 1; }
  .card-title { font-family: var(--font-hud); font-size: 13px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .card-genre { font-size: 10px; background: rgba(255,255,255,0.05); border-radius: 4px; padding: 2px 6px; }

  .card-rating { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .rating-bar { flex: 1; height: 3px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
  .rating-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--violet), var(--cyan)); transition: width 1s ease; }
  .rating-num { font-family: var(--font-mono); font-size: 10px; color: var(--cyan); min-width: 28px; text-align: right; }

  .btn-send {
    width: 100%; padding: 9px;
    background: linear-gradient(135deg, rgba(0,207,255,0.12), rgba(123,47,255,0.12));
    border: 1px solid rgba(0,207,255,0.35); border-radius: 8px;
    color: var(--cyan); font-family: var(--font-hud); font-size: 10px; letter-spacing: 2px;
    cursor: pointer; transition: var(--transition); position: relative; overflow: hidden;
  }
  .btn-send::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    opacity: 0; transition: opacity var(--transition);
  }
  .btn-send:hover { color: #fff; border-color: var(--cyan); box-shadow: var(--cyan-glow); }
  .btn-send:hover::after { opacity: 0.15; }
  .btn-send span { position: relative; z-index: 1; }

  @keyframes cardFadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .game-card:nth-child(1)  { animation-delay: 0.05s; }
  .game-card:nth-child(2)  { animation-delay: 0.10s; }
  .game-card:nth-child(3)  { animation-delay: 0.15s; }
  .game-card:nth-child(4)  { animation-delay: 0.20s; }
  .game-card:nth-child(5)  { animation-delay: 0.25s; }
  .game-card:nth-child(6)  { animation-delay: 0.30s; }
  .game-card:nth-child(7)  { animation-delay: 0.35s; }
  .game-card:nth-child(8)  { animation-delay: 0.40s; }

  /* Empty state */
  .empty-state {
    grid-column: 1/-1; text-align: center; padding: 80px 20px;
    font-family: var(--font-mono); color: var(--text-muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state h3 { font-family: var(--font-hud); color: var(--cyan); margin-bottom: 8px; }

  /* ============================
     MODAL
  ============================ */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(4,6,15,0.8);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: rgba(8,12,28,0.97);
    border: 1px solid var(--glass-border);
    border-radius: 20px; width: 100%; max-width: 560px; max-height: 90vh;
    overflow-y: auto; position: relative;
    box-shadow: var(--violet-glow), 0 40px 80px rgba(0,0,0,0.8);
    transform: translateY(30px) scale(0.96);
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    scrollbar-width: thin; scrollbar-color: var(--cyan) transparent;
  }
  .modal-overlay.open .modal { transform: translateY(0) scale(1); }
  .modal::-webkit-scrollbar { width: 4px; }
  .modal::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 4px; }

  .modal-cover {
    width: 100%; aspect-ratio: 16/9;
    background: linear-gradient(135deg, rgba(123,47,255,0.4), rgba(0,207,255,0.2));
    display: flex; align-items: center; justify-content: center;
    font-size: 80px; border-radius: 20px 20px 0 0; overflow: hidden;
  }
  .modal-body { padding: 24px; }
  .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; gap: 12px; }
  .modal-title { font-family: var(--font-hud); font-size: 20px; font-weight: 900; line-height: 1.2; }
  .modal-close {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-muted); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: var(--transition);
  }
  .modal-close:hover { background: rgba(255,60,60,0.2); border-color: #ff3c3c; color: #ff3c3c; }

  .modal-score {
    display: inline-flex; align-items: center; gap: 8px; margin-bottom: 16px;
    background: rgba(0,207,255,0.08); border: 1px solid rgba(0,207,255,0.25);
    border-radius: 8px; padding: 8px 16px;
  }
  .score-box {
    width: 52px; height: 52px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-hud); font-weight: 900; font-size: 22px;
    background: linear-gradient(135deg, var(--violet), var(--cyan));
    color: #fff; box-shadow: var(--cyan-glow);
  }
  .score-label { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); line-height: 1.6; }
  .score-label strong { display: block; color: var(--text-primary); font-size: 13px; }

  .modal-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .tag {
    padding: 4px 12px; border-radius: 20px; font-family: var(--font-mono); font-size: 11px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
    color: var(--text-muted);
  }
  .tag.cyan  { background: rgba(0,207,255,0.1);   border-color: rgba(0,207,255,0.3);   color: var(--cyan); }
  .tag.violet { background: rgba(123,47,255,0.1); border-color: rgba(123,47,255,0.3); color: #b078ff; }

  .modal-desc { font-size: 15px; color: rgba(232,244,255,0.75); line-height: 1.7; margin-bottom: 20px; }

  .modal-info-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px;
  }
  .info-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 10px 14px; }
  .info-label { font-family: var(--font-mono); font-size: 9px; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 4px; }
  .info-value { font-family: var(--font-hud); font-size: 13px; color: var(--text-primary); }

  .btn-primary {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, var(--violet), var(--cyan));
    border: none; border-radius: 12px; color: #fff;
    font-family: var(--font-hud); font-size: 13px; letter-spacing: 3px; font-weight: 700;
    cursor: pointer; transition: var(--transition); position: relative; overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,207,255,0.3);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: var(--cyan-glow), 0 8px 30px rgba(0,207,255,0.3); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary::after {
    content: ''; position: absolute; top: -50%; left: -100%; width: 60%; height: 200%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    transform: skewX(-20deg);
    animation: shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer { 0%,100%{left:-100%} 50%{left:150%} }

  /* ============================
     TOAST NOTIFICATION
  ============================ */
  #toastContainer { position: fixed; bottom: 30px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
  .toast {
    min-width: 300px; max-width: 380px;
    background: rgba(4,6,15,0.97); border-radius: 12px; padding: 14px 18px;
    border-left: 4px solid var(--cyan);
    box-shadow: var(--cyan-glow), 0 20px 40px rgba(0,0,0,0.6);
    font-family: var(--font-mono); font-size: 12px; color: var(--text-primary);
    animation: toastIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .toast.exit { animation: toastOut 0.3s ease forwards; }
  .toast-icon { font-size: 20px; flex-shrink: 0; margin-top: 2px; }
  .toast-title { font-family: var(--font-hud); font-size: 12px; color: var(--cyan); margin-bottom: 4px; }
  .toast-msg { color: var(--text-muted); line-height: 1.5; word-break: break-all; }
  @keyframes toastIn { from{opacity:0;transform:translateX(100%) scale(0.8)} to{opacity:1;transform:translateX(0) scale(1)} }
  @keyframes toastOut { to{opacity:0;transform:translateX(110%) scale(0.9)} }

  /* ============================
     PAGE HEADER SECTION
  ============================ */
  .page-hero {
    padding: 30px 0 10px; animation: fadeUp 0.6s ease both;
  }
  .page-hero h2 { font-family: var(--font-hud); font-size: clamp(24px,5vw,44px); font-weight: 900; letter-spacing: 2px; line-height: 1.1; }
  .page-hero h2 .glow { color: var(--cyan); text-shadow: var(--cyan-glow); }
  .page-hero p { font-size: 15px; color: var(--text-muted); margin-top: 8px; max-width: 480px; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

  /* ============================
     SCROLLBAR
  ============================ */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,207,255,0.35); border-radius: 6px; }

  /* ============================
     MOBILE RESPONSIVE
  ============================ */
  @media(max-width:640px) {
    .header-inner { height: auto; padding: 12px 0; flex-wrap: wrap; }
    .hud-panel { gap: 12px; }
    .hud-clock { font-size: 18px; }
    .search-wrap { order: 3; max-width: 100%; width: 100%; }
    .games-grid { grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 14px; }
    .btn-send { padding: 12px; font-size: 11px; }
    .modal-info-grid { grid-template-columns: 1fr; }
    .modal-title { font-size: 16px; }
    .score-box { width: 44px; height: 44px; font-size: 18px; }
    .toast { min-width: 260px; }
    #toastContainer { right: 12px; bottom: 20px; }
  }
  @media(max-width:400px) {
    .games-grid { grid-template-columns: 1fr 1fr; }
  }

  /* ============================
     SECTION TITLE
  ============================ */
  .section-divider {
    display: flex; align-items: center; gap: 12px;
    padding: 24px 0 4px; font-family: var(--font-mono); font-size: 11px;
    color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase;
  }
  .section-divider::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,rgba(0,207,255,0.3),transparent); }
</style>
</head>
<body>

<!-- Dynamic Background Layers -->
<div class="bg-aurora" aria-hidden="true"></div>
<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-scanlines" aria-hidden="true"></div>

<!-- ========== HEADER ========== -->
<header>
  <div class="header-inner">
    <!-- Logo -->
    <div class="logo-wrap">
      <div class="logo-icon">AS</div>
      <div>
        <div class="logo-text">AURORA<span> STORE</span></div>
        <div class="logo-sub">BY LUCIO &nbsp;·&nbsp; v3.0.0</div>

// ── UTILS ──────────────────────────────────────────────────────────────────
const ALL_ITEMS = Object.entries(CATALOGO).flatMap(([cat, arr]) => arr.map(g => ({ ...g, _cat: cat })));

function getRatingColor(r) {
  if (r >= 85) return 'linear-gradient(135deg,#7B2FFF,#00CFFF)';
  if (r >= 70) return 'linear-gradient(135deg,#ff9000,#ffcc00)';
  return 'linear-gradient(135deg,#ff3c3c,#ff8800)';
}
function getRatingLabel(r) {
  if (r >= 90) return 'OBRA MAESTRA';
  if (r >= 80) return 'MUY BUENO';
  if (r >= 70) return 'BUENO';
  return 'REGULAR';
}
function catBadgeClass(cat) {
  return { juego:'badge-game', app:'badge-app', emu:'badge-emu', plugin:'badge-plugin' }[cat] || '';
}
function catLabel(cat) {
  return { juego:'GAME', app:'APP', emu:'EMU', plugin:'PLUGIN' }[cat] || cat.toUpperCase();
}

// ── CLOCK ──────────────────────────────────────────────────────────────────
(function clock(){
  const el = document.getElementById('hudClock');
  function tick(){
    const d = new Date();
    el.textContent = [d.getHours(),d.getMinutes(),d.getSeconds()]
      .map(v=>String(v).padStart(2,'0')).join(':');
  }
  tick(); setInterval(tick, 1000);
})();

// ── STATE ──────────────────────────────────────────────────────────────────
let currentCat = 'all';
let searchTerm  = '';
let currentItem  = null;

function getFiltered() {
  return ALL_ITEMS.filter(item => {
    const matchCat  = currentCat === 'all' || item._cat === currentCat;
    const term      = searchTerm.toLowerCase();
    const matchTerm = !term ||
      item.titulo.toLowerCase().includes(term) ||
      item.genero.toLowerCase().includes(term) ||
      item.desarrollador.toLowerCase().includes(term) ||
      (item.tags||[]).some(t => t.toLowerCase().includes(term));
    return matchCat && matchTerm;
  });
}

// ── RENDER GRID ────────────────────────────────────────────────────────────
const grid = document.getElementById('gamesGrid');
const resultCount = document.getElementById('resultCount');
const activeCategory = document.getElementById('activeCategory');

function renderGrid() {
  const items = getFiltered();
  resultCount.textContent = items.length;
  activeCategory.textContent = currentCat === 'all' ? 'TODO' : currentCat.toUpperCase();
  grid.innerHTML = '';

  if (!items.length) {
    grid.innerHTML = `<div class="empty-state">
      <div class="icon">🔍</div>
      <h3>SIN RESULTADOS</h3>
      <p>No se encontraron títulos para "<em>${searchTerm}</em>"</p>
    </div>`;
    return;
  }

  items.forEach((item, i) => {
    const card = document.createElement('article');
    card.className = 'game-card';
    card.style.animationDelay = `${i * 0.06}s`;
    card.setAttribute('aria-label', item.titulo);

    card.innerHTML = `
      <div class="card-cover-placeholder">${item.emoji}</div>
      <div class="card-badge ${catBadgeClass(item._cat)}">${catLabel(item._cat)}</div>
      <div class="card-body">
        <div class="card-title">${item.titulo}</div>
        <div class="card-meta">
          <span>${item.desarrollador}</span>
          <span class="card-genre">${item.genero}</span>
        </div>
        <div class="card-rating">
          <div class="rating-bar"><div class="rating-fill" style="width:${item.rating}%;background:${getRatingColor(item.rating)}"></div></div>
          <span class="rating-num">${item.rating}</span>
        </div>
        <button class="btn-send" data-id="${item.id}" data-cat="${item._cat}" aria-label="Enviar ${item.titulo} a Xbox">
          <span>⚡ ENVIAR A XBOX</span>
        </button>
      </div>
    `;

    card.addEventListener('click', e => {
      if (!e.target.closest('.btn-send')) openModal(item);
    });
    card.querySelector('.btn-send').addEventListener('click', e => {
      e.stopPropagation();
      sendToXbox(item);
    });

    grid.appendChild(card);
  });
}

// ── TABS ──────────────────────────────────────────────────────────────────
document.getElementById('navTabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentCat = btn.dataset.cat;
  renderGrid();
});

// ── SEARCH ────────────────────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value;
  renderGrid();
});

// ── MODAL ────────────────────────────────────────────────────────────────
const overlay = document.getElementById('modalOverlay');
const modalClose = document.getElementById('modalClose');

function openModal(item) {
  currentItem = item;
  document.getElementById('modalCover').textContent = item.emoji;
  document.getElementById('modalGameTitle').textContent = item.titulo;

  const scoreBox = document.getElementById('modalScore');
  scoreBox.textContent = item.rating;
  scoreBox.style.background = getRatingColor(item.rating);
  document.getElementById('modalScoreLabel').textContent = getRatingLabel(item.rating);
  document.getElementById('modalScoreSub').textContent = `${item.año} · ${item.genero}`;

  const tagsEl = document.getElementById('modalTags');
  tagsEl.innerHTML = `
    <span class="tag cyan">${catLabel(item._cat)}</span>
    <span class="tag violet">${item.genero}</span>
    ${(item.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}
  `;

  document.getElementById('modalDesc').textContent = item.descripcion;

  document.getElementById('modalInfoGrid').innerHTML = `
    <div class="info-item"><div class="info-label">Desarrollador</div><div class="info-value">${item.desarrollador}</div></div>
    <div class="info-item"><div class="info-label">Género</div><div class="info-value">${item.genero}</div></div>
    <div class="info-item"><div class="info-label">Peso</div><div class="info-value">${item.peso}</div></div>
    <div class="info-item"><div class="info-label">Lanzamiento</div><div class="info-value">${item.año}</div></div>
  `;

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  overlay.querySelector('.modal').scrollTop = 0;
}

function closeModal() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
  setTimeout(() => { currentItem = null; }, 350);
}

modalClose.addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

document.getElementById('modalSendBtn').addEventListener('click', () => {
  if (currentItem) { closeModal(); sendToXbox(currentItem); }
});

// ── SEND TO XBOX / TOAST ──────────────────────────────────────────────────
function generateId() {
  return 'XBOX-' + Math.random().toString(36).substr(2,6).toUpperCase() + '-' + Date.now().toString(36).toUpperCase();
}

function sendToXbox(item) {
  const cmdId = generateId();
  const payload = {
    remote_command: {
      id: cmdId,
      action: "INSTALL_TITLE",
      target: item.id,
      category: item._cat,
      title: item.titulo,
      timestamp: new Date().toISOString(),
      requester: "AURORA_STORE_BY_LUCIO"
    }
  };

  // Simulate download of remote_command.json
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'remote_command.json'; a.click();
  URL.revokeObjectURL(url);

  showToast({
    icon: '⚡',
    title: 'COMANDO ENVIADO',
    msg: `${item.titulo}\nID: ${cmdId}`,
    color: 'var(--cyan)'
  });
}

function showToast({ icon, title, msg, color = 'var(--cyan)' }) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.style.borderLeftColor = color;
  toast.innerHTML = `
    <div class="toast-icon">${icon}</div>
    <div>
      <div class="toast-title">${title}</div>
      <div class="toast-msg">${msg.replace(/\n/g,'<br>')}</div>
    </div>
  `;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('exit');
    setTimeout(() => toast.remove(), 350);
  }, 4500);
}

// ── INIT ──────────────────────────────────────────────────────────────────
renderGrid();
